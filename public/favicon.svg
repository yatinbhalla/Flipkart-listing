<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ListOnce">
  <!--
    One upload going out to several storefronts — what the app does, drawn rather
    than spelled. Marketplace-neutral on purpose: it was Flipkart's yellow f, which
    stopped being true once Shopsy and Meesho arrived and will be wronger still when
    Amazon does.

    Three blocks and nothing else. A favicon is read at 16px, where one unit of this
    grid is a quarter of a pixel: a first attempt with three targets and connecting
    arrows turned into a grey smudge, and a second with two targets still bridged
    into a C because the arrows filled the gap between them. The arrangement carries
    the meaning on its own — one amber source, two pale destinations — and survives
    the downscale because nothing is thinner than 5px of grid or closer than 9 to its
    neighbour.
  -->
  <rect width="64" height="64" rx="14" fill="#1E293B"/>
  <rect x="6" y="21" width="22" height="22" rx="6" fill="#F59E0B"/>
  <g fill="#E2E8F0">
    <rect x="37" y="8" width="21" height="21" rx="6"/>
    <rect x="37" y="35" width="21" height="21" rx="6"/>
  </g>
</svg>
